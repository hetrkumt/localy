# LEGACY / emergency only.
#
# Logical DBs orderdb/paymentdb/storedb are owned by GitOps:
#   localy-manifests/platform/workload-dbs/base/create-dbs-job.yaml
#   Argo Application: workload-dbs (sync-wave 15)
#
# Prefer waiting for that app to sync after teardown/redeploy.
# Use this manifest only if Argo cannot sync and you must unblock apps:
#   kubectl apply -f workload-create-dbs-job.yaml
#
# NOTE: This legacy Job mounts localy-keycloak-secret in auth-namespace.
# The GitOps Job uses workload-dbs-rds-secret from localy-prod-database-credentials.
apiVersion: batch/v1
kind: Job
metadata:
  name: workload-create-dbs
  namespace: auth-namespace
  labels:
    app.kubernetes.io/name: workload-create-dbs
    localy.io/legacy: "true"
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workload-create-dbs
    spec:
      restartPolicy: Never
      nodeSelector:
        karpenter.sh/nodepool: workload
        kubernetes.io/arch: amd64
      tolerations:
        - key: workload-only
          operator: Equal
          value: "true"
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: secret-volume
          secret:
            secretName: localy-keycloak-secret
            defaultMode: 0400
            items:
              - key: KEYCLOAK_DATABASE_HOST
                path: host
              - key: KEYCLOAK_DATABASE_PASSWORD
                path: password
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
      containers:
        - name: psql
          image: postgres:15-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: secret-volume
              mountPath: /etc/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
          env:
            - name: PGUSER
              value: postgres
            - name: PGDATABASE
              value: localy
          command:
            - sh
            - -c
            - |
              set -eu
              export PGHOST="$(cat /etc/secrets/host)"
              export PGPASSWORD="$(cat /etc/secrets/password)"
              echo "Waiting for PostgreSQL at ${PGHOST}..."
              i=0
              until pg_isready -h "$PGHOST" -U "$PGUSER" -d "$PGDATABASE" >/dev/null 2>&1; do
                i=$((i + 1))
                if [ "$i" -gt 60 ]; then
                  echo "Timed out waiting for pg_isready"
                  exit 1
                fi
                sleep 2
              done
              for db in orderdb paymentdb storedb; do
                exists="$(psql -Atc "SELECT 1 FROM pg_database WHERE datname = '$db'")"
                if [ "$exists" = "1" ]; then
                  echo "Database $db already exists"
                else
                  echo "Creating database $db..."
                  psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE $db OWNER postgres"
                  echo "Database $db created"
                fi
              done
              echo "Done."
